AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Simulated Bitcoin + fiat brokerage ledger API — Lambda + API Gateway +
  DynamoDB, with an append-only transaction log as the source of truth for
  account balances.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12
    Environment:
      Variables:
        ACCOUNTS_TABLE_NAME: !Ref AccountsTable
        TRANSACTIONS_TABLE_NAME: !Ref TransactionsTable
        # Declared here (empty) purely so `sam local invoke --env-vars` has
        # an existing key to override — SAM CLI only overrides environment
        # variables already declared in the template, it silently drops any
        # key in --env-vars that isn't. Stays empty on a real deploy, so
        # app.py's `if _endpoint_url:` check is never true there.
        DYNAMODB_ENDPOINT_URL: ""

Resources:
  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-accounts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-transactions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
        - AttributeName: executed_at
          AttributeType: S
      KeySchema:
        - AttributeName: transaction_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AccountIndex
          KeySchema:
            - AttributeName: account_id
              KeyType: HASH
            - AttributeName: executed_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  LedgerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
      Events:
        CreateAccount:
          Type: Api
          Properties:
            Path: /accounts
            Method: post
        GetAccount:
          Type: Api
          Properties:
            Path: /accounts/{account_id}
            Method: get
        VerifyBalance:
          Type: Api
          Properties:
            Path: /accounts/{account_id}/balance/verify
            Method: get
        CreateTransaction:
          Type: Api
          Properties:
            Path: /accounts/{account_id}/transactions
            Method: post
        ListTransactions:
          Type: Api
          Properties:
            Path: /accounts/{account_id}/transactions
            Method: get
        GetPrice:
          Type: Api
          Properties:
            Path: /price
            Method: get

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL for the Prod stage
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  AccountsTableName:
    Value: !Ref AccountsTable
  TransactionsTableName:
    Value: !Ref TransactionsTable
