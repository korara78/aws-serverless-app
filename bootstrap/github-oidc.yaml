AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time bootstrap: a GitHub Actions OIDC identity provider (one per AWS
  account) plus an IAM role trusted only by this repo's main branch, used by
  .github/workflows/ci-cd.yml to deploy without long-lived AWS keys.

Parameters:
  GitHubOrg:
    Type: String
    Default: korara78
  RepoName:
    Type: String
    Default: aws-serverless-app
  # GitHub embeds these immutable IDs in the OIDC sub claim (alongside the
  # human-readable org/repo names) so the trust relationship survives repo
  # or org renames without being reusable by a new resource that reclaims
  # the old name. Look up via: gh api users/<org> --jq .id ,
  # gh api repos/<org>/<repo> --jq .id
  GitHubOrgId:
    Type: String
    Default: "79677336"
  RepoId:
    Type: String
    Default: "1320920972"

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RepoName}-github-actions-deploy"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}@${GitHubOrgId}/${RepoName}@${RepoId}:ref:refs/heads/main"
      Policies:
        - PolicyName: SamDeployScoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                Resource:
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/${RepoName}/*"
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
              # sam deploy --resolve-s3 bootstraps its own managed-bucket stack,
              # which itself uses this transform -- needed even before the app
              # stack is touched, not just for template.yaml's own transform.
              - Sid: CloudFormationServerlessTransform
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource:
                  - "arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-31"
              # TagResource is required to create the bucket in the first place;
              # DeleteBucket is required for CloudFormation to roll back cleanly
              # if a later step in that bootstrap stack fails.
              - Sid: SamManagedDeployBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketVersioning
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:TagResource
                  - s3:UntagResource
                  - s3:PutBucketTagging
                Resource:
                  - "arn:aws:s3:::aws-sam-cli-managed-default*"
                  - "arn:aws:s3:::aws-sam-cli-managed-default*/*"
              # The frontend's own bucket: created/updated by `sam deploy`
              # itself, then synced into by a separate `aws s3 sync` step in
              # ci-cd.yml (SAM doesn't upload arbitrary static files, only
              # the resources it manages) — both need the same permissions.
              - Sid: FrontendBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:TagResource
                Resource:
                  - !Sub "arn:aws:s3:::${RepoName}-frontend*"
                  - !Sub "arn:aws:s3:::${RepoName}-frontend*/*"
              # CloudFront resources don't have a predictable ARN before
              # they're created (the distribution/OAC ID is assigned on
              # creation), so the Create* actions need Resource: "*" — this
              # is standard for AWS resource-creation IAM actions, not a
              # broader grant than necessary. The rest are scoped to this
              # account. CreateInvalidation is what ci-cd.yml uses after
              # every frontend sync so CloudFront serves the new files
              # immediately instead of stale cached ones.
              - Sid: CloudFrontDistributionCreate
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateOriginAccessControl
                Resource: "*"
              - Sid: CloudFrontDistributionManage
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource:
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/*"
              - Sid: Lambda
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:PublishVersion
                  - lambda:ListVersionsByFunction
                  - lambda:TagResource
                Resource:
                  - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:${RepoName}-*"
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:*
                Resource:
                  - "arn:aws:apigateway:*::/restapis*"
              - Sid: DynamoDb
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:TagResource
                  - dynamodb:DescribeTimeToLive
                Resource:
                  - !Sub "arn:aws:dynamodb:*:${AWS::AccountId}:table/${RepoName}-*"
              - Sid: LambdaExecutionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${RepoName}-*"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource:
                  - !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${RepoName}-*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
